name: Portfolio checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check portfolio and all three demos
        run: node --test
      - name: Check potential tracked secrets
        run: |
          if grep -R -n -E '(sk-(proj-)?[A-Za-z0-9_-]{24,}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|AKIA[A-Z0-9]{16}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' --include='*.js' --include='*.mjs' --include='*.json' --include='*.html' projects index.html; then exit 1; fi
