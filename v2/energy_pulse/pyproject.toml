[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-energy-pulse"
version = "0.1.0"
description = "Synthetic industrial telemetry data-quality reference implementation"
requires-python = ">=3.12,<3.15"
dependencies = ["fastapi==0.143.1", "uvicorn==0.54.0", "pydantic==2.14.1"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
